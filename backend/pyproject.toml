[project]
name = "datapilot"
version = "0.1.0"
description = "Natural-language to SQL agent with RAG, ambiguity detection, AST validation and an execution-accuracy eval"
readme = "README.md"
authors = [
    { name = "ritesh1884", email = "riteshpatel1884@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "langchain>=1.3.15",
    "langchain-core>=1.5.5",
    "langchain-groq>=1.1.3",
    "langchain-qdrant>=1.1.0",
    "langsmith>=0.11.0",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.54",
    "sqlglot>=30.17.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

[tool.uv]
package = false